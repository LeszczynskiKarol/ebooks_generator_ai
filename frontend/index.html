<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create professional eBooks with AI. Print-ready PDF & EPUB in minutes." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>InkMagnet — AI eBook Generator</title>
    <!-- GA4 (same property as inkmagnet.com) with Consent Mode v2 defaults DENIED:
         no cookies are set, only cookieless consent pings, which is enough for
         sign_up counts + country/source breakdown. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
        analytics_storage: 'denied', functionality_storage: 'granted',
        personalization_storage: 'denied', security_storage: 'granted',
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QLDSL0FSYN"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-QLDSL0FSYN', { anonymize_ip: true, cookie_flags: 'SameSite=Lax;Secure' });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
